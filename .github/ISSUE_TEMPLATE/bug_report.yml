name: 🐞 问题反馈
description: 报告崩溃、报错、构建失败或与预期不符的行为
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先搜索[已有 issue](https://github.com/OpenHUTB/hutb/issues)，避免重复。
        请尽量提供**可复现的步骤**和**完整日志**，这能大大加快问题定位。

  - type: checkboxes
    id: prerequisites
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 issue，没有找到相同问题
          required: true
        - label: 我已阅读[文档](https://openhutb.github.io/)
          required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Ubuntu
        - Windows
        - macOS
        - 其他
    validations:
      required: true

  - type: dropdown
    id: usage
    attributes:
      label: 使用方式
      options:
        - 源码编译运行
        - 发布包（启动脚本）
        - Python API 脚本
        - 其他
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本 / 提交哈希
      description: 可在仓库目录运行 `git log -1 --oneline` 查看
      placeholder: 例如 0.9.15 / d3cb6a1cd
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际发生了什么？
      placeholder: 简要描述你遇到的问题……
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请按顺序列出最小复现步骤，必要时附上代码片段
      placeholder: |
        1. 运行 `./setup.sh`
        2. 执行 `python3 script.py`
        3. 出现报错……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 报错信息
      description: 粘贴完整终端输出或崩溃日志（会自动显示为代码块）
      render: shell
      placeholder: 粘贴日志……

  - type: textarea
    id: screenshots
    attributes:
      label: 截图或录屏
      description: 可直接将图片拖拽到此处

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 硬件配置、GPU / 驱动版本、修改过的配置等任何有助于定位问题的信息
