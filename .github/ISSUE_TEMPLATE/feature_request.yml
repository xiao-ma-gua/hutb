name: ✨ 功能建议
description: 提出新功能、改进或文档完善建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！提交前请先搜索[已有 issue](https://github.com/OpenHUTB/hutb/issues)，确认没有重复。

  - type: checkboxes
    id: prerequisites
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 issue，没有找到相同建议
          required: true

  - type: textarea
    id: motivation
    attributes:
      label: 需求背景
      description: 你遇到了什么问题或场景，促使你提出这个建议？
      placeholder: 在……场景下，目前无法……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望 HUTB 提供什么样的功能或改进？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过的其他做法或临时解决方案

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 参考链接、相关 issue、截图等
